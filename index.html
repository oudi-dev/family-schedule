<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Schedule</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Family Schedule</h1>
    <div class="view-toggle">
      <button id="btn-week" class="active">Week</button>
      <button id="btn-day">Day</button>
    </div>
  </header>

  <main>
    <!-- Week View -->
    <section id="week-view">
      <div class="week-nav">
        <button id="prev-week">&#8592;</button>
        <span id="week-label"></span>
        <button id="next-week">&#8594;</button>
      </div>
      <div class="week-grid" id="week-grid"></div>
    </section>

    <!-- Day View -->
    <section id="day-view" class="hidden">
      <div class="day-nav">
        <button id="prev-day">&#8592;</button>
        <span id="day-label"></span>
        <button id="next-day">&#8594;</button>
      </div>
      <div class="day-schedule" id="day-schedule"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
